<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Μετρητής Πόντων</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --felt-dark:#0F2E22;
      --felt:#173F2E;
      --felt-light:#1F5540;
      --cream:#F3ECDC;
      --cream-dim:#D9D0B8;
      --gold:#D4AF37;
      --gold-dim:#9C8A3E;
      --ink:#12261C;
      --red:#C24B3E;
      --muted:#8FA79A;
      --radius:14px;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;}
    body{
      background:radial-gradient(ellipse at top, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
      background-attachment:fixed;
      color:var(--cream);
      font-family:'Work Sans', sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding-bottom:40px;
    }
    #app{width:100%; max-width:480px; min-height:100vh; position:relative; padding:0 16px;}
    h1,h2,h3{font-family:'Fraunces', serif; margin:0; letter-spacing:0.2px;}
    .eyebrow{
      text-transform:uppercase; letter-spacing:2.5px; font-size:11px; color:var(--gold-dim);
      font-weight:600; margin-bottom:6px;
    }
    .screen{display:none; animation:fadeIn .25s ease;}
    .screen.active{display:block;}
    @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

    /* header */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:calc(22px + env(safe-area-inset-top, 0px)) 0 18px 0;
    }
    .topbar h1{font-size:26px; font-weight:600; color:var(--cream);}
    .suit-mark{color:var(--gold); font-size:22px; margin-right:6px;}
    .icon-btn{
      background:none; border:1px solid rgba(243,236,220,0.25); color:var(--cream-dim);
      width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .icon-btn:active{background:rgba(243,236,220,0.1);}

    /* game picker cards */
    .game-grid{display:flex; flex-direction:column; gap:12px; margin-top:8px;}
    .game-card{
      background:linear-gradient(155deg, rgba(243,236,220,0.06), rgba(243,236,220,0.02));
      border:1px solid rgba(212,175,55,0.25);
      border-radius:var(--radius);
      padding:18px 18px;
      display:flex; align-items:center; gap:16px;
      cursor:pointer;
      transition:border-color .15s, background .15s;
    }
    .game-card:active{background:rgba(212,175,55,0.08); border-color:var(--gold);}
    .game-suit{
      width:52px; height:52px; border-radius:50%; border:1.5px solid var(--gold);
      display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--gold);
      flex-shrink:0;
    }
    .game-card .g-name{font-family:'Fraunces', serif; font-size:19px; font-weight:600; color:var(--cream);}
    .game-card .g-sub{font-size:12.5px; color:var(--muted); margin-top:3px;}
    .game-card.custom{border-style:dashed;}
    .game-card.continue-card{border-color:var(--gold); background:rgba(212,175,55,0.1);}
    .game-card.continue-card .g-name{color:var(--gold);}
    .continue-delete{
      background:none; border:1px solid rgba(243,236,220,0.25); color:var(--cream-dim);
      width:32px; height:32px; border-radius:50%; font-size:14px; cursor:pointer; flex-shrink:0;
    }

    .history-link{
      margin-top:22px; text-align:center; color:var(--muted); font-size:13px;
      text-decoration:underline; text-underline-offset:3px; cursor:pointer;
    }

    /* setup screen */
    .card-panel{
      background:rgba(243,236,220,0.05); border:1px solid rgba(212,175,55,0.2);
      border-radius:var(--radius); padding:18px; margin-top:16px;
    }
    label.field-label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold-dim); font-weight:600; margin-bottom:8px;}
    .pill-row{display:flex; gap:8px; flex-wrap:wrap;}
    .pill{
      padding:9px 16px; border-radius:100px; border:1px solid rgba(212,175,55,0.35);
      background:transparent; color:var(--cream-dim); font-size:14px; cursor:pointer; font-weight:500;
    }
    .pill.selected{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:600;}
    input[type=text], input[type=number]{
      width:100%; background:rgba(15,46,34,0.5); border:1px solid rgba(212,175,55,0.3);
      color:var(--cream); border-radius:10px; padding:11px 13px; font-size:15px; font-family:inherit;
      outline:none;
    }
    input[type=text]:focus, input[type=number]:focus{border-color:var(--gold);}
    .name-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
    .name-row .suit-badge{
      width:30px; height:30px; border-radius:50%; background:rgba(212,175,55,0.15); color:var(--gold);
      display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
    }
    .team-group{border-left:2px solid var(--gold-dim); padding-left:12px; margin-bottom:16px;}
    .team-group .team-label{font-size:12px; color:var(--muted); margin-bottom:8px; letter-spacing:1px; text-transform:uppercase;}
    .field-block{margin-top:16px;}
    .hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5;}

    .btn-primary{
      width:100%; background:var(--gold); color:var(--ink); border:none; border-radius:12px;
      padding:15px; font-size:15.5px; font-weight:600; font-family:'Work Sans', sans-serif;
      cursor:pointer; margin-top:22px; letter-spacing:0.3px;
    }
    .btn-primary:active{background:#c19f2e;}
    .btn-secondary{
      width:100%; background:transparent; color:var(--cream-dim); border:1px solid rgba(243,236,220,0.25);
      border-radius:12px; padding:13px; font-size:14px; font-weight:500; cursor:pointer; margin-top:10px;
    }
    .btn-text{background:none; border:none; color:var(--gold-dim); font-size:13px; cursor:pointer; padding:6px 0; text-decoration:underline; text-underline-offset:3px;}

    /* board screen */
    .board-header{padding:20px 0 8px 0;}
    .board-title{display:flex; align-items:baseline; gap:8px;}
    .board-title .suit-mark{font-size:20px;}
    .round-pill{
      display:inline-block; margin-top:6px; font-size:12px; color:var(--muted);
      border:1px solid rgba(243,236,220,0.2); border-radius:100px; padding:3px 11px;
    }
    .target-note{font-size:12px; color:var(--gold-dim); margin-top:4px;}

    .scoreboard{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
    .unit-card{
      background:rgba(243,236,220,0.05); border:1px solid rgba(212,175,55,0.18);
      border-radius:var(--radius); padding:14px 16px;
      display:flex; align-items:center; justify-content:space-between;
      position:relative; overflow:hidden;
    }
    .unit-card.leader{border-color:var(--gold); background:rgba(212,175,55,0.09);}
    .unit-card.leader::before{
      content:"♛"; position:absolute; top:-6px; right:8px; font-size:34px; color:rgba(212,175,55,0.18);
    }
    .unit-left{display:flex; align-items:center; gap:12px;}
    .unit-suit{
      width:38px; height:38px; border-radius:50%; background:rgba(212,175,55,0.14); color:var(--gold);
      display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
    }
    .unit-name{font-family:'Fraunces', serif; font-weight:600; font-size:16px; color:var(--cream);}
    .unit-members{font-size:11.5px; color:var(--muted); margin-top:2px;}
    .unit-score{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:24px; color:var(--cream);}
    .unit-score.negative{color:var(--red);}

    .fab-row{display:flex; gap:10px; margin-top:20px;}
    .fab-main{
      flex:1; background:var(--gold); color:var(--ink); border:none; border-radius:14px;
      padding:16px; font-size:15.5px; font-weight:700; font-family:'Work Sans', sans-serif; cursor:pointer;
    }
    .fab-main:active{background:#c19f2e;}
    .fab-side{
      width:52px; background:transparent; border:1px solid rgba(243,236,220,0.25); color:var(--cream-dim);
      border-radius:14px; font-size:18px; cursor:pointer;
    }

    .section-title{margin-top:26px; font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold-dim); font-weight:600; display:flex; justify-content:space-between; align-items:center;}
    .round-list{margin-top:10px; display:flex; flex-direction:column; gap:1px; border-top:1px solid rgba(243,236,220,0.1);}
    .round-row{
      display:flex; align-items:center; padding:10px 4px; border-bottom:1px solid rgba(243,236,220,0.1);
      font-size:13px; gap:8px;
    }
    .round-row .rn{width:26px; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:12px; flex-shrink:0;}
    .round-row .rs{flex:1; display:flex; gap:14px; flex-wrap:wrap; font-family:'IBM Plex Mono', monospace;}
    .round-row .rs span{color:var(--cream-dim);}
    .round-row .rs b{color:var(--cream); font-weight:600;}
    .round-row .rdel{color:var(--muted); background:none; border:none; font-size:15px; cursor:pointer; padding:2px 6px;}
    .empty-note{color:var(--muted); font-size:13px; text-align:center; padding:18px 0;}

    /* modal */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(8,20,15,0.72); display:none;
      align-items:flex-end; justify-content:center; z-index:50;
    }
    .modal-backdrop.active{display:flex;}
    .modal-sheet{
      width:100%; max-width:480px; background:var(--felt-dark); border:1px solid rgba(212,175,55,0.3);
      border-bottom:none; border-radius:20px 20px 0 0; padding:22px 18px 26px 18px;
      max-height:85vh; overflow-y:auto;
    }
    .modal-handle{width:36px; height:4px; background:rgba(243,236,220,0.25); border-radius:4px; margin:0 auto 16px auto;}
    .score-input-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
    .score-input-row .sn{font-family:'Fraunces', serif; font-weight:600; font-size:15px; flex:1;}
    .score-stepper{display:flex; align-items:center; gap:8px;}
    .step-btn{
      width:36px; height:36px; border-radius:10px; border:1px solid rgba(212,175,55,0.35);
      background:transparent; color:var(--gold); font-size:18px; cursor:pointer; font-weight:600;
    }
    .step-btn:active{background:rgba(212,175,55,0.15);}
    .score-num{
      width:74px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:17px; font-weight:700;
    }

    .round-total-note{
      font-size:12px; color:var(--gold-dim); text-align:center; margin-bottom:14px;
      padding:8px; background:rgba(212,175,55,0.08); border-radius:8px;
    }
    .unit-entry-block{
      background:rgba(243,236,220,0.045); border:1px solid rgba(212,175,55,0.28);
      border-radius:14px; padding:14px 14px 4px 14px; margin-bottom:14px;
    }
    .unit-entry-header{
      font-family:'Fraunces', serif; font-weight:600; font-size:16px; color:var(--gold);
      margin-bottom:12px; display:flex; align-items:center; gap:8px;
    }
    .unit-entry-header .suit-mark{font-size:17px; margin-right:0;}
    .calls-block{margin-top:10px; padding-top:10px; border-top:1px dashed rgba(212,175,55,0.25);}
    .biriba-pill-grid{display:flex; flex-wrap:wrap; gap:8px;}
    .biriba-pill{
      padding:9px 12px; border-radius:10px; border:1px solid rgba(212,175,55,0.35);
      background:rgba(212,175,55,0.06); color:var(--cream-dim); font-size:12.5px; font-weight:500;
      cursor:pointer; font-family:'Work Sans', sans-serif;
    }
    .biriba-pill:active{background:var(--gold); color:var(--ink); border-color:var(--gold);}
    .biriba-list{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
    .biriba-item{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.3); border-radius:8px;
      padding:7px 10px; font-size:12.5px; color:var(--cream);
    }
    .biriba-item-remove{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 6px;}
    .call-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
    .call-row .cn{font-size:13px; color:var(--cream-dim); flex:1;}
    .call-select{
      background:rgba(15,46,34,0.6); border:1px solid rgba(212,175,55,0.35); color:var(--cream);
      border-radius:8px; padding:7px 8px; font-size:12.5px; font-family:'Work Sans', sans-serif;
    }
    .double-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px;}
    .double-row .dn{font-size:12.5px; color:var(--gold-dim);}
    .toggle-pill{
      padding:6px 13px; border-radius:100px; border:1px solid rgba(212,175,55,0.4);
      background:transparent; color:var(--cream-dim); font-size:12px; cursor:pointer; font-weight:600;
    }
    .toggle-pill.on{background:var(--gold); color:var(--ink); border-color:var(--gold);}
    .round-calls{font-size:11.5px; color:var(--gold-dim); margin-top:3px; width:100%;}
    .tichu-stats{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
    .stat-row{
      display:flex; align-items:center; justify-content:space-between; background:rgba(243,236,220,0.04);
      border:1px solid rgba(212,175,55,0.15); border-radius:10px; padding:10px 14px; font-size:13px;
    }
    .stat-row .st-name{font-weight:600; color:var(--cream);}
    .stat-row .st-nums{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--cream-dim); display:flex; gap:12px;}
    .stat-row .st-nums b{color:var(--gold);}

    .final-banner{
      text-align:center; padding:26px 14px; background:rgba(212,175,55,0.08);
      border:1px solid var(--gold); border-radius:var(--radius); margin-top:16px;
    }
    .final-banner .winner-name{font-family:'Fraunces', serif; font-size:22px; color:var(--gold); margin-top:6px;}
    .toast{
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:var(--cream); color:var(--ink); padding:10px 18px; border-radius:100px;
      font-size:13px; font-weight:600; z-index:80; display:none; box-shadow:0 8px 20px rgba(0,0,0,0.3);
    }

    /* history */
    .history-item{
      background:rgba(243,236,220,0.05); border:1px solid rgba(212,175,55,0.15); border-radius:12px;
      padding:14px 16px; margin-bottom:10px;
    }
    .history-item .h-top{display:flex; justify-content:space-between; align-items:center;}
    .history-item .h-game{font-family:'Fraunces', serif; font-weight:600; font-size:15px;}
    .history-item .h-date{font-size:11px; color:var(--muted);}
    .history-item .h-winner{font-size:13px; color:var(--gold); margin-top:6px;}
      .round-row .redit{color:var(--gold-dim); background:none; border:none; font-size:14px; cursor:pointer; padding:2px 6px;}
    .history-share{color:var(--gold-dim); background:none; border:1px solid rgba(212,175,55,0.3); border-radius:8px; font-size:12px; cursor:pointer; padding:5px 10px; margin-top:8px;}
  </style>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23173F2E'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23D4AF37' font-family='Georgia, serif'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#173F2E">
  <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <h1><span class="suit-mark">♠</span>Μετρητής Πόντων</h1>
    </div>
    <div class="eyebrow">Επίλεξε παιχνίδι</div>
    <div class="game-grid" id="game-grid"></div>
    <div class="history-link" id="open-history">Ιστορικό παιχνιδιών →</div>
  </div>

  <!-- SETUP -->
  <div class="screen" id="screen-setup">
    <div class="topbar">
      <button class="icon-btn" id="setup-back-btn">←</button>
      <h1 id="setup-title" style="font-size:20px;">Ρύθμιση</h1>
      <div style="width:38px;"></div>
    </div>
    <div id="setup-body"></div>
  </div>

  <!-- BOARD -->
  <div class="screen" id="screen-board">
    <div class="topbar">
      <button class="icon-btn" id="board-back-btn">←</button>
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" id="share-btn" title="Κοινοποίηση αποτελεσμάτων">⤴</button>
        <button class="icon-btn" id="undo-btn" title="Αναίρεση τελευταίου γύρου">↺</button>
        <button class="icon-btn" id="board-menu-btn">⋮</button>
      </div>
    </div>
    <div class="board-header">
      <div class="board-title"><span class="suit-mark" id="board-suit">♠</span><h2 id="board-title" style="font-size:21px;"></h2></div>
      <div class="round-pill" id="board-round-pill">Γύρος 1</div>
      <div class="target-note" id="board-target-note"></div>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div class="fab-row">
      <button class="fab-main" id="add-round-btn">+ Νέος Γύρος</button>
      <button class="fab-side" id="end-game-btn" title="Τέλος παιχνιδιού">🏁</button>
    </div>
    <div class="section-title">Ιστορικό γύρων</div>
    <div class="round-list" id="round-list"></div>
  </div>

  <!-- HISTORY -->
  <div class="screen" id="screen-history">
    <div class="topbar">
      <button class="icon-btn" id="history-back-btn">←</button>
      <h1 style="font-size:20px;">Ιστορικό</h1>
      <div style="width:38px;"></div>
    </div>
    <div id="history-list"></div>
  </div>

</div>

<!-- ROUND ENTRY MODAL -->
<div class="modal-backdrop" id="round-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 style="margin-bottom:16px; font-size:17px;">Πόντοι γύρου <span id="modal-round-num"></span></h3>
    <div id="modal-inputs"></div>
    <button class="btn-primary" id="save-round-btn">Καταχώρηση</button>
    <button class="btn-secondary" id="cancel-round-btn">Ακύρωση</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  window.onerror = function(msg, url, line, col, err){
    showErrorBanner('JS ERROR: ' + msg + ' (γραμμή ' + line + ':' + col + ')' + (err && err.stack ? '\n' + err.stack : ''));
    return false;
  };
  window.addEventListener('unhandledrejection', function(e){
    const reason = e.reason;
    showErrorBanner('PROMISE ERROR: ' + (reason && reason.message ? reason.message : reason) + (reason && reason.stack ? '\n' + reason.stack : ''));
  });
  function showErrorBanner(text){
    let banner = document.getElementById('js-error-banner');
    if(!banner){
      banner = document.createElement('div');
      banner.id = 'js-error-banner';
      banner.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#c0392b; color:#fff; font-size:12px; padding:10px; z-index:9999; white-space:pre-wrap; max-height:50vh; overflow:auto; font-family:monospace;';
      const closeBtn = document.createElement('button');
      closeBtn.textContent = '✕ Κλείσιμο';
      closeBtn.style.cssText = 'display:block; margin-top:8px; background:#fff; color:#c0392b; border:none; padding:6px 12px; border-radius:6px; font-weight:bold;';
      closeBtn.onclick = ()=>{ banner.remove(); };
      banner.appendChild(document.createElement('br'));
      banner.appendChild(closeBtn);
      document.body.appendChild(banner);
    }
    const textNode = document.createTextNode(text + '\n');
    banner.insertBefore(textNode, banner.firstChild);
  }

  /* ---------------- storage helpers ---------------- */
  async function sGet(key){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  async function sSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error('storage set failed', e); }
  }
  async function sDelete(key){
    try{ localStorage.removeItem(key); }catch(e){}
  }
  async function sListByPrefix(prefix){
    try{
      const keys = [];
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(prefix)) keys.push(k);
      }
      return keys;
    }catch(e){ return []; }
  }
  async function sListHistory(){ return sListByPrefix('history:'); }
  async function sListOngoing(){ return sListByPrefix('ongoing:'); }
  async function saveOngoingGame(g){

  const GAME_TEMPLATES = [
    {id:'xeri', name:'Ξερή', suit:'♣', teamMode:false, playerCounts:[2,4], teamModeByCount:{2:false, 4:true}, defaultTarget:null, sub:'2 ατομικά ή 4 σε 2 ζευγάρια'},

    {id:'biriba', name:'Μπιρίμπα', suit:'♦', teamMode:true, fixedPlayers:4, defaultTarget:null, sub:'4 παίκτες · 2 ζευγάρια'},
    {id:'wizard', name:'Wizard', suit:'♥', icon: ICON_DICE, teamMode:false, playerCounts:[3,4,5,6], defaultTarget:null, sub:'3-6 παίκτες · Προβλέψεις & Μπάζες'},
  ];

  function wizardMaxRounds(playerCount){
    return Math.floor(60 / playerCount);
  }

  function iconOrSuitHtml(entity, sizePx){
    if(entity && entity.icon){
      return `<img src="${entity.icon}" alt="" style="width:${sizePx}px; height:${sizePx}px; object-fit:contain; border-radius:50%;" />`;
    }
    return entity ? entity.suit : '';
  }

  let state = {
    currentGame: null,
    draftTemplate: null,
    draftPlayerCount: null,
    editingRoundIndex: null,
  };

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display='block';
    setTimeout(()=>{ t.style.display='none'; }, 1800);
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ---------------- HOME ---------------- */
  async function renderHome(){
    const grid = document.getElementById('game-grid');
    grid.innerHTML = '';

    document.querySelectorAll('.continue-card').forEach(el=> el.remove());

    const ongoingKeys = await sListOngoing();
    const ongoingGames = [];
    for(const k of ongoingKeys){
      const gm = await sGet(k);
      if(gm && !gm.finished) ongoingGames.push(gm);
    }
    ongoingGames.sort((a,b)=> (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt));

    const eyebrow = document.querySelector('#screen-home .eyebrow');
    ongoingGames.forEach(gm=>{
      const cb = document.createElement('div');
      cb.className = 'game-card continue-card';
      cb.innerHTML = `<div class="game-suit">${iconOrSuitHtml(gm, 28)}</div>
        <div style="flex:1;"><div class="g-name">Συνέχεια: ${gm.gameName}</div><div class="g-sub">Γύρος ${gm.rounds.length+1} σε εξέλιξη</div></div>
        <button class="continue-delete" data-id="${gm.id}">✕</button>`;
      cb.onclick = (e)=>{
        if(e.target.classList.contains('continue-delete')) return;
        continueSavedGame(gm.id);
      };
      cb.querySelector('.continue-delete').onclick = (e)=>{
        e.stopPropagation();
        deleteOngoingGame(gm.id);
      };
      document.getElementById('screen-home').insertBefore(cb, eyebrow);
    });

    GAME_TEMPLATES.forEach(t=>{
      const el = document.createElement('div');
      el.className = 'game-card';
      el.innerHTML = `<div class="game-suit">${iconOrSuitHtml(t, 28)}</div>
        <div><div class="g-name">${t.name}</div><div class="g-sub">${t.sub}</div></div>`;
      el.onclick = ()=> startSetup(t);
      grid.appendChild(el);
    });
    const customEl = document.createElement('div');
    customEl.className = 'game-card custom';
    customEl.innerHTML = `<div class="game-suit">+</div>
      <div><div class="g-name">Άλλο παιχνίδι</div><div class="g-sub">Δημιούργησε προσαρμοσμένο</div></div>`;
    customEl.onclick = ()=> startCustomSetup();
    grid.appendChild(customEl);
  }

  /* ---------------- history-api navigation (for Android back-gesture) ---------------- */
  function enterAwayState(){
    if(!history.state || !history.state.level){
      history.pushState({level:1}, '');
    }
  }
  function enterModalState(){
    if(!history.state || history.state.level < 2){
      history.pushState({level:2}, '');
    }
  }
  function goToHomeHistoryLevel(){
    const lvl = (history.state && history.state.level) || 0;
    if(lvl > 0) history.go(-lvl);
  }
  function popModalHistoryIfNeeded(){
    if(history.state && history.state.level === 2) history.back();
  }
  window.addEventListener('popstate', (e)=>{
    const level = (e.state && e.state.level) || 0;
    if(level === 0){
      confirmGoHome();
    } else if(level === 1){
      const modal = document.getElementById('round-modal');
      if(modal.classList.contains('active')){
        modal.classList.remove('active');
        state.editingRoundIndex = null;
      }
    }
  });

  async function continueSavedGame(id){
    const saved = await sGet('ongoing:'+id);
    if(!saved) return;
    enterAwayState();
    state.currentGame = saved;
    await sSet('last_active_game_id', id);

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  async function createGame(){
    const t = state.draftTemplate;
    let name = t.name;
    if(t.custom){
      name = document.getElementById('custom-name').value.trim() || 'Προσαρμοσμένο';
    }
    const targetRaw = document.getElementById('target-input').value;
    const target = targetRaw ? parseInt(targetRaw) : null;

    const nameInputs = document.querySelectorAll('.player-name');
    const names = [];
    nameInputs.forEach(inp=>{
      const idx = parseInt(inp.dataset.idx);
      names[idx] = inp.value.trim();
    });

    let units = [];
    const isTeam = effectiveTeamMode(t);
    if(isTeam){
      for(let team=0; team<2; team++){
        const m1 = names[team*2] || `Παίκτης ${team*2+1}`;
        const m2 = names[team*2+1] || `Παίκτης ${team*2+2}`;
        const members = [{id:uid(), name:m1}, {id:uid(), name:m2}];
        units.push({ id: uid(), type:'team', name: `${m1} & ${m2}`, members, suit: SUITS[team*2%4], icon: t.icon || null });
      }
    } else {
      for(let i=0; i<state.draftPlayerCount; i++){
        const nm = names[i] || `Παίκτης ${i+1}`;
        units.push({ id: uid(), type:'player', name: nm, members:[nm], suit: SUITS[i%4], icon: t.icon || null });
      }
    }

    state.currentGame = {
      id: uid(),
      gameId: t.id,
      gameName: name,
      suit: t.suit,
      icon: t.icon || null,
      teamMode: isTeam,
      units: units,
      target: target,
      rounds: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
      finished: false,
    };
    await saveOngoingGame(state.currentGame);
    enterAwayState();
    renderBoard();
    showScreen('screen-board');
  }

  function renderBoard(){
    ensureFabRow();

    document.getElementById('board-round-pill').textContent = isWizardGame
      ? `Γύρος ${Math.min(g.rounds.length+1, wizardMax)} / ${wizardMax}`

  function renderTichuStats(){
    const g = state.currentGame;
    let box = document.getElementById('tichu-stats-box');
    if(g.gameId !== 'tichu'){
      if(box) box.remove();
      return;
    }
    const stats = {};
    g.units.forEach(u=> u.members.forEach(m=>{
      stats[m.id] = { name:m.name, tichuWin:0, tichuLoss:0, grandWin:0, grandLoss:0 };
    }));
    g.rounds.forEach(r=>{
      if(!r.calls) return;
      Object.values(r.calls).forEach(tc=>{
        Object.entries(tc.players||{}).forEach(([pid, c])=>{
          if(!stats[pid]) return;
          if(c.value==='tichu_win') stats[pid].tichuWin++;
          if(c.value==='tichu_loss') stats[pid].tichuLoss++;
          if(c.value==='grand_win') stats[pid].grandWin++;
          if(c.value==='grand_loss') stats[pid].grandLoss++;
        });
      });
    });

    if(!box){
      box = document.createElement('div');
      box.id = 'tichu-stats-box';
      document.getElementById('scoreboard').insertAdjacentElement('afterend', box);
    }
    const rows = Object.values(stats).map(s=>`
      <div class="stat-row">
        <div class="st-name">${s.name}</div>
        <div class="st-nums">
          <span>Tichu: <b>${s.tichuWin}✓</b> ${s.tichuLoss}✗</span>
          <span>Grand: <b>${s.grandWin}✓</b> ${s.grandLoss}✗</span>
        </div>
      </div>`).join('');
    box.innerHTML = `<div class="section-title">Στατιστικά Tichu</div><div class="tichu-stats">${rows}</div>`;
  }

  const CHART_PALETTE = ['#D4AF37','#F3ECDC','#C24B3E','#5DCAA5','#7F77DD','#ED93B1'];

  function renderScoreChart(){
    const g = state.currentGame;
    let box = document.getElementById('score-chart-box');
    if(g.rounds.length < 2){
      if(box) box.remove();
      return;
    }
    const series = g.units.map((u,idx)=>{
      let cum = 0;
      const pts = g.rounds.map(r=> cum += (r.scores[u.id]||0));
      return { unit:u, color: CHART_PALETTE[idx % CHART_PALETTE.length], pts };
    });
    const allVals = series.flatMap(s=>s.pts).concat([0]);
    const maxV = Math.max(...allVals);
    const minV = Math.min(...allVals);
    const range = (maxV - minV) || 1;
    const w = 320, h = 140, padL = 8, padR = 8, padT = 10, padB = 10;
    const n = g.rounds.length;
    const xStep = n > 1 ? (w - padL - padR) / (n - 1) : 0;
    const yFor = v => padT + (h - padT - padB) * (1 - (v - minV) / range);
    const lines = series.map(s=>{
      const d = s.pts.map((v,i)=> `${i===0 ? 'M' : 'L'} ${(padL + i*xStep).toFixed(1)} ${yFor(v).toFixed(1)}`).join(' ');
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    }).join('');
    const legend = series.map(s=>
      `<div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--cream-dim);">
        <span style="width:9px; height:9px; border-radius:50%; background:${s.color}; display:inline-block; flex-shrink:0;"></span>${s.unit.name.split(' ')[0]}
      </div>`
    ).join('');

    if(!box){
      box = document.createElement('div');
      box.id = 'score-chart-box';
      document.getElementById('scoreboard').insertAdjacentElement('afterend', box);
    }
    box.innerHTML = `<div class="section-title">Εξέλιξη πόντων</div>
      <div style="margin-top:10px; background:rgba(243,236,220,0.04); border:1px solid rgba(212,175,55,0.15); border-radius:12px; padding:12px;">
        <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${lines}</svg>
        <div style="display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:10px;">${legend}</div>
      </div>`;
  }

  function renderRoundList(){
    const g = state.currentGame;
    const list = document.getElementById('round-list');
    if(g.rounds.length === 0){
      list.innerHTML = '<div class="empty-note">Δεν έχουν καταχωρηθεί γύροι ακόμα.</div>';
      return;
    }
    list.innerHTML = '';
    [...g.rounds].reverse().forEach((r, revIdx)=>{
      const idx = g.rounds.length - 1 - revIdx;
      const row = document.createElement('div');
      row.className = 'round-row';
      const scoresHtml = g.units.map(u=>`<span>${u.name.split(' ')[0]}: <b>${r.scores[u.id]||0}</b></span>`).join('');
      let callsHtml = '';
      if(r.calls){
        const bits = [];
        Object.entries(r.calls).forEach(([unitId, tc])=>{
          if(tc.players){
            Object.values(tc.players).forEach(c=>{
              const lbl = c.value==='tichu_win' ? 'Tichu ✓' : c.value==='tichu_loss' ? 'Tichu ✗' : c.value==='grand_win' ? 'Grand ✓' : 'Grand ✗';
              bits.push(`${c.name}: ${lbl}`);
            });
            if(tc.doubleWin) bits.push('1-2 ✓');
          }
          if(tc.xeriCount){
            const unit = g.units.find(x=>x.id===unitId);
            bits.push(`${unit ? unit.name.split(' ')[0] : ''}: Ξερές ×${tc.xeriCount} (+${tc.xeriPoints})`);
          }
          if(tc.bid !== undefined){
            const unit = g.units.find(x=>x.id===unitId);
            bits.push(`${unit ? unit.name.split(' ')[0] : ''}: πρόβλ. ${tc.bid} / μπάζες ${tc.tricks} ${tc.hit ? '✓' : '✗'}`);
          }
          if(tc.biriba){
            const unit = g.units.find(x=>x.id===unitId);
            tc.biriba.forEach(e=>{
              bits.push(`${unit ? unit.name.split(' ')[0] : ''}: ${e.label}`);
            });
          }
        });
        if(bits.length) callsHtml = `<div class="round-calls">${bits.join(' · ')}</div>`;
      }
      row.innerHTML = `<div class="rn">#${idx+1}</div><div class="rs">${scoresHtml}${callsHtml}</div>
        <button class="redit" data-idx="${idx}">✎</button>
        <button class="rdel" data-idx="${idx}">✕</button>`;
      row.querySelector('.redit').onclick = ()=> openRoundModal(idx);
      row.querySelector('.rdel').onclick = ()=> deleteRound(idx);
      list.appendChild(row);
    });
  }

        const calcBox = document.createElement('div');
        calcBox.className = 'round-total-note';
        calcBox.id = 'calc-box-'+u.id;
        calcBox.style.textAlign = 'left';
        calcBox.textContent = 'Υπολογισμένοι πόντοι: +0';
        block.appendChild(calcBox);
      }

      if(isTichu && u.type==='team'){
        const cb = document.createElement('div');
        cb.className = 'calls-block';
        const optionsHtml = CALL_OPTIONS.map(o=>`<option value="${o.value}">${o.label}</option>`).join('');
        let html = '';
        u.members.forEach(m=>{
          html += `<div class="call-row"><div class="cn">${m.name}</div>
            <select class="call-select" id="call-${m.id}">${optionsHtml}</select></div>`;
        });
        html += `<div class="double-row"><div class="dn">1-2 · Διπλή Νίκη (+200)</div>
          <button class="toggle-pill" id="double-${u.id}" data-team="${u.id}">Ανενεργό</button></div>`;
        cb.innerHTML = html;
        block.appendChild(cb);
      }

      if(isBiriba && u.type==='team'){
        state.biribaEntries[u.id] = [];
        const bb = document.createElement('div');
        bb.className = 'calls-block';
        const pillsHtml = BIRIBA_OPTIONS.filter(o=>o.value!=='none').map(o=>
          `<button class="biriba-pill" data-value="${o.value}">${o.label}</button>`
        ).join('');
        bb.innerHTML = `<div class="dn" style="margin-bottom:8px;">Μπιρίμπα — πάτα για προσθήκη (μπορείς πολλές φορές)</div>
          <div class="biriba-pill-grid">${pillsHtml}</div>
          <div class="biriba-list" id="biriba-list-${u.id}"></div>`;
        block.appendChild(bb);
        bb.querySelectorAll('.biriba-pill').forEach(pill=>{
          pill.onclick = ()=> addBiribaEntry(u.id, pill.dataset.value);
        });
      }

      if(isXeri){
        const xb = document.createElement('div');
        xb.className = 'calls-block';
        xb.innerHTML = `<div class="double-row"><div class="dn">Ξερές (× ${XERI_POINTS_PER_XERI} πόντοι)</div>
          <div class="score-stepper">
            <button class="step-btn" data-xminus>−</button>
            <input type="number" class="score-num" id="xeri-${u.id}" value="0" min="0" inputmode="numeric" readonly />
            <button class="step-btn" data-xplus>+</button>
          </div></div>`;
        xb.querySelector('[data-xminus]').onclick = ()=> stepXeri(u.id, -1);
        xb.querySelector('[data-xplus]').onclick = ()=> stepXeri(u.id, 1);
        block.appendChild(xb);
      }

      if(editRound){
        const tc = editRound.calls ? editRound.calls[u.id] : null;
        const totalScore = editRound.scores[u.id] || 0;
        if(isWizard){
          if(tc){
            document.getElementById('bid-'+u.id).value = tc.bid;
            document.getElementById('tricks-'+u.id).value = tc.tricks;
          }
          updateWizardCalc(u.id);
        } else {
          let bonus = 0;
          if(isTichu && u.type==='team' && tc){
            Object.entries(tc.players||{}).forEach(([mid,c])=>{
              bonus += c.points;
              const sel = document.getElementById('call-'+mid);
              if(sel) sel.value = c.value;
            });
            if(tc.doubleWin){
              bonus += 200;
              const btn = document.getElementById('double-'+u.id);
              if(btn){ btn.classList.add('on'); btn.textContent = 'Ενεργό ✓'; }
            }
          }
          if(isBiriba && u.type==='team' && tc && tc.biriba){
            state.biribaEntries[u.id] = tc.biriba.map(e=>({...e}));
            bonus += tc.biriba.reduce((s,e)=> s+e.points, 0);
            renderBiribaList(u.id);
            updateBiribaCalc(u.id);
          }
          if(isXeri && tc && tc.xeriCount){
            bonus += tc.xeriPoints;
            const xinp = document.getElementById('xeri-'+u.id);
            if(xinp) xinp.value = tc.xeriCount;
            updateXeriCalc(u.id);
          }
          const scoreInp = document.getElementById('score-'+u.id);
          if(scoreInp) scoreInp.value = totalScore - bonus;
        }
      }

      wrap.appendChild(block);
    });

    if(isTichu){
      g.units.forEach(u=>{
        const btn = document.getElementById('double-'+u.id);
        if(!btn) return;
        btn.onclick = ()=>{
          const isOn = btn.classList.contains('on');
          g.units.forEach(other=>{
            const ob = document.getElementById('double-'+other.id);
            if(ob){ ob.classList.remove('on'); ob.textContent = 'Ανενεργό'; }
          });
          if(!isOn){ btn.classList.add('on'); btn.textContent = 'Ενεργό ✓'; }
        };
      });
    }

    if(roundTotal){
      setupRoundTotalHelper(g.units, roundTotal, wrap);
    }

    if(isWizard){
      const indicator = document.createElement('div');
      indicator.className = 'round-total-note';
      indicator.id = 'wizard-round-indicator';
      wrap.insertBefore(indicator, wrap.firstChild);
      updateWizardRoundTotal();
    }

    enterModalState();
    document.getElementById('round-modal').classList.add('active');
  }

  function stepWizardValue(id, dir, max){
    const inp = document.getElementById(id);
    let next = (parseInt(inp.value)||0) + dir;
    next = Math.max(0, Math.min(max, next));
    inp.value = next;
    return next;
  }

  function updateWizardCalc(unitId){
    const bidInp = document.getElementById('bid-'+unitId);
    const trickInp = document.getElementById('tricks-'+unitId);
    const bid = parseInt(bidInp ? bidInp.value : 0) || 0;
    const tricks = parseInt(trickInp ? trickInp.value : 0) || 0;
    const score = bid === tricks ? (20 + 10*bid) : (-10 * Math.abs(bid - tricks));
    const box = document.getElementById('calc-box-'+unitId);
    if(box) box.textContent = `Πόντοι γύρου: ${score>=0?'+':''}${score}`;
    updateWizardRoundTotal();
  }

  function updateWizardRoundTotal(){
    const g = state.currentGame;
    const roundNumber = (typeof state.editingRoundIndex === 'number') ? state.editingRoundIndex+1 : g.rounds.length+1;
    let sum = 0;
    g.units.forEach(u=>{
      const t = document.getElementById('tricks-'+u.id);
      sum += parseInt(t ? t.value : 0) || 0;
    });
    const indicator = document.getElementById('wizard-round-indicator');
    if(indicator){
      const remaining = roundNumber - sum;
      indicator.textContent = `Άθροισμα μπαζών: ${sum} / ${roundNumber}` + (remaining !== 0 ? ` (μένουν ${remaining})` : ' ✓');
    }
  }

  function setupRoundTotalHelper(units, total, wrap){
    if(units.length === 2){
      const inpA = document.getElementById('score-'+units[0].id);
      const inpB = document.getElementById('score-'+units[1].id);
      const note = document.createElement('div');
      note.className = 'round-total-note';
      note.textContent = `Οι βασικοί πόντοι συμπληρώνονται αυτόματα ώστε το άθροισμα να είναι ${total}.`;
      wrap.insertBefore(note, wrap.firstChild);
      inpA.addEventListener('input', ()=>{ inpB.value = total - (parseInt(inpA.value)||0); });
      inpB.addEventListener('input', ()=>{ inpA.value = total - (parseInt(inpB.value)||0); });
    } else {
      const indicator = document.createElement('div');
      indicator.className = 'round-total-note';
      indicator.id = 'round-total-indicator';
      wrap.insertBefore(indicator, wrap.firstChild);
      const updateIndicator = ()=>{
        let sum = 0;
        units.forEach(u=>{ sum += parseInt(document.getElementById('score-'+u.id).value) || 0; });
        const remaining = total - sum;
        indicator.textContent = `Άθροισμα γύρου: ${sum} / ${total}` + (remaining !== 0 ? ` (μένουν ${remaining})` : ' ✓');
      };
      units.forEach(u=>{
        document.getElementById('score-'+u.id).addEventListener('input', updateIndicator);
      });
      updateIndicator();
    }
  }

  function stepScore(unitId, dir){
    const inp = document.getElementById('score-'+unitId);
    inp.value = (parseInt(inp.value)||0) + dir;
    inp.dispatchEvent(new Event('input', {bubbles:true}));
  }

  function stepXeri(unitId, dir){
    const inp = document.getElementById('xeri-'+unitId);
    const next = Math.max(0, (parseInt(inp.value)||0) + dir);
    inp.value = next;
    updateXeriCalc(unitId);
  }

  function updateXeriCalc(unitId){
    const inp = document.getElementById('xeri-'+unitId);
    const count = parseInt(inp ? inp.value : 0) || 0;
    const box = document.getElementById('calc-box-'+unitId);
    if(box) box.textContent = `Υπολογισμένοι πόντοι: +${count * XERI_POINTS_PER_XERI}`;
  }

  function addBiribaEntry(unitId, val){
    if(val === 'none') return;
    const opt = BIRIBA_OPTIONS.find(o=>o.value===val);
    state.biribaEntries[unitId].push({ value: opt.value, label: opt.label, points: opt.points });
    renderBiribaList(unitId);
    updateBiribaCalc(unitId);
  }

  function removeBiribaEntry(unitId, idx){
    state.biribaEntries[unitId].splice(idx,1);
    renderBiribaList(unitId);
    updateBiribaCalc(unitId);
  }

  function updateBiribaCalc(unitId){
    const entries = state.biribaEntries[unitId] || [];
    const pts = entries.reduce((s,e)=> s + e.points, 0);
    const box = document.getElementById('calc-box-'+unitId);
    if(box) box.textContent = `Υπολογισμένοι πόντοι: +${pts}`;
  }

  function renderBiribaList(unitId){
    const list = document.getElementById('biriba-list-'+unitId);
    const entries = state.biribaEntries[unitId];
    list.innerHTML = entries.map((e,idx)=>`
      <div class="biriba-item">
        <span>${e.label}</span>
        <button class="biriba-item-remove" data-idx="${idx}">✕</button>
      </div>`).join('');
    list.querySelectorAll('.biriba-item-remove').forEach(btn=>{
      btn.onclick = ()=> removeBiribaEntry(unitId, parseInt(btn.dataset.idx));
    });
  }

  function closeModal(id){
    document.getElementById(id).classList.remove('active');
  }

  document.getElementById('save-round-btn').onclick = async ()=>{
   try{
    const g = state.currentGame;
    const isTichu = g.gameId === 'tichu';
    const isXeri = g.gameId === 'xeri';
    const isBiriba = g.gameId === 'biriba';
    const isWizard = g.gameId === 'wizard';
    const scores = {};
    const calls = {};
    g.units.forEach(u=>{
      let total = 0;
      if(isWizard){
        const bidInp = document.getElementById('bid-'+u.id);
        const trickInp = document.getElementById('tricks-'+u.id);
        const bid = parseInt(bidInp ? bidInp.value : 0) || 0;
        const tricks = parseInt(trickInp ? trickInp.value : 0) || 0;
        total = bid === tricks ? (20 + 10*bid) : (-10 * Math.abs(bid - tricks));
        calls[u.id] = { bid, tricks, hit: bid===tricks };
        scores[u.id] = total;
        return;
      }
      const inp = document.getElementById('score-'+u.id);
      total = parseInt(inp.value) || 0;
      if(isTichu && u.type==='team'){
        const teamCalls = { players: {}, doubleWin: false };
        u.members.forEach(m=>{
          const sel = document.getElementById('call-'+m.id);
          const val = sel ? sel.value : 'none';
          if(val !== 'none'){
            const opt = CALL_OPTIONS.find(o=>o.value===val);
            total += opt.points;
            teamCalls.players[m.id] = { name:m.name, value: val, points: opt.points };
          }
        });
        const dbtn = document.getElementById('double-'+u.id);
        if(dbtn && dbtn.classList.contains('on')){
          total += 200;
          teamCalls.doubleWin = true;
        }
        calls[u.id] = teamCalls;
      }
      if(isBiriba && u.type==='team'){
        const entries = state.biribaEntries[u.id] || [];
        if(entries.length){
          entries.forEach(e=>{ total += e.points; });
          calls[u.id] = { biriba: entries };
        }
      }
      if(isXeri){
        const xinp = document.getElementById('xeri-'+u.id);
        const count = parseInt(xinp ? xinp.value : 0) || 0;
        if(count > 0){
          total += count * XERI_POINTS_PER_XERI;
          calls[u.id] = { xeriCount: count, xeriPoints: count * XERI_POINTS_PER_XERI };
        }
      }
      scores[u.id] = total;
    });
    if(typeof state.editingRoundIndex === 'number'){
      const existing = g.rounds[state.editingRoundIndex];
      g.rounds[state.editingRoundIndex] = { scores, calls, at: existing ? existing.at : Date.now() };
      state.editingRoundIndex = null;
    } else {
      g.rounds.push({ scores, calls, at: Date.now() });
    }
    g.updatedAt = Date.now();
    await saveOngoingGame(g);
    closeModal('round-modal');
    popModalHistoryIfNeeded();
    renderBoard();
    checkTarget();
   }catch(err){
    showErrorBanner('SAVE ROUND ERROR: ' + err.message + '\n' + err.stack);
   }
  };

  function checkTarget(){
    const g = state.currentGame;
    if(!g.target) return;
    const winners = g.units.filter(u => totalsFor(u.id) >= g.target);
    if(winners.length){
      const names = winners.map(w=>w.name).join(', ');
      showToast(`🎉 ${names} έφτασε τον στόχο (${g.target})!`);
    }
  }

  /* ---------------- END GAME ---------------- */
  async function endGame(){
    const g = state.currentGame;
    if(!g.rounds.length){
      if(!confirm('Δεν έχουν παιχτεί γύροι. Τέλος παιχνιδιού;')) return;
    } else {
      if(!confirm('Τέλος παιχνιδιού; Θα αποθηκευτεί στο ιστορικό.')) return;
    }
    const totals = g.units.map(u=>({name:u.name, suit:u.suit, total: totalsFor(u.id)}));
    totals.sort((a,b)=> b.total - a.total);
    const topScore = totals.length ? totals[0].total : null;
    const winners = totals.filter(t=> t.total === topScore);

    const record = {
      id: g.id,
      gameName: g.gameName,
      suit: g.suit,
      icon: g.icon || null,
      date: Date.now(),
      standings: totals,
      winner: winners.map(w=>w.name).join(' & ') || null,
      roundsPlayed: g.rounds.length,
    };
    await sSet('history:'+g.id, record);
    await sDelete('ongoing:'+g.id);
    const lastActive = await sGet('last_active_game_id');
    if(lastActive === g.id) await sDelete('last_active_game_id');
    g.finished = true;

    showFinalBanner(totals, winners);
  }

  function showFinalBanner(totals, winners){
    const w = winners && winners.length ? winners : (totals[0] ? [totals[0]] : []);
    const banner = document.createElement('div');
    banner.className = 'final-banner';
    banner.innerHTML = `<div class="eyebrow">${w.length>1 ? 'Ισοπαλία' : 'Τέλος Παιχνιδιού'}</div>
      <div class="winner-name">🏆 ${w.length ? w.map(x=>x.name).join(' & ') : '—'}</div>`;
    document.getElementById('scoreboard').prepend(banner);
    document.getElementById('add-round-btn').style.display = 'none';
    document.querySelector('.fab-row').innerHTML = `<button class="fab-side" id="share-final-btn" title="Κοινοποίηση">⤴</button><button class="fab-main" id="new-game-btn">Νέο Παιχνίδι</button>`;
    document.getElementById('new-game-btn').onclick = goHome;
    document.getElementById('share-final-btn').onclick = ()=> shareText(buildOngoingShareText(state.currentGame));
    document.getElementById('undo-btn').style.visibility = 'hidden';
  }

  /* ---------------- SHARE ---------------- */
  function buildOngoingShareText(g){
    const totals = g.units.map(u=>({name:u.name, total: totalsFor(u.id)})).sort((a,b)=> b.total-a.total);
    const lines = [`${g.suit} ${g.gameName}`, `${g.rounds.length} γύροι`, ''];
    totals.forEach((t,i)=> lines.push(`${i+1}. ${t.name}: ${t.total}`));
    return lines.join('\n');
  }

  function buildHistoryShareText(r){
    const lines = [`${r.suit} ${r.gameName}`, `${r.roundsPlayed} γύροι`, ''];
    (r.standings||[]).forEach((s,i)=> lines.push(`${i+1}. ${s.name}: ${s.total}`));
    lines.push('', `🏆 ${r.winner || '—'}`);
    return lines.join('\n');
  }

  async function shareText(text){
    if(navigator.share){
      try{ await navigator.share({ text }); }catch(e){ /* cancelled */ }
    } else if(navigator.clipboard){
      try{ await navigator.clipboard.writeText(text); showToast('Αντιγράφηκε στο πρόχειρο!'); }
      catch(e){ showToast('Αποτυχία αντιγραφής'); }
    } else {
      showToast('Δεν υποστηρίζεται η κοινοποίηση');
    }
  }

  /* ---------------- HISTORY ---------------- */
  document.getElementById('open-history').onclick = async ()=>{
    enterAwayState();
    await renderHistory();
    showScreen('screen-history');
  };

  async function renderHistory(){
    const keys = await sListHistory();
    const list = document.getElementById('history-list');
    if(!keys.length){
      list.innerHTML = '<div class="empty-note">Δεν υπάρχουν ολοκληρωμένα παιχνίδια ακόμα.</div>';
      return;
    }
    const records = [];
    for(const k of keys){
      const r = await sGet(k);
      if(r) records.push(r);
    }
    records.sort((a,b)=> b.date - a.date);
    list.innerHTML = '';
    records.forEach(r=>{
      const d = new Date(r.date);
      const dateStr = d.toLocaleDateString('el-GR', {day:'2-digit', month:'short', year:'numeric'});
      const el = document.createElement('div');
      el.className = 'history-item';
      el.innerHTML = `<div class="h-top"><div class="h-game">${iconOrSuitHtml(r, 16)} ${r.gameName}</div><div class="h-date">${dateStr}</div></div>
        <div class="h-winner">🏆 ${r.winner || '—'} · ${r.roundsPlayed} γύροι</div>
        <button class="history-share">Κοινοποίηση</button>`;
      el.querySelector('.history-share').onclick = ()=> shareText(buildHistoryShareText(r));
      list.appendChild(el);
    });
  }

  /* ---------------- INIT ---------------- */
  async function init(){
    document.getElementById('setup-back-btn').onclick = ()=> history.back();
    document.getElementById('board-back-btn').onclick = ()=> history.back();
    document.getElementById('board-menu-btn').onclick = openMenu;
    document.getElementById('share-btn').onclick = ()=>{ if(state.currentGame) shareText(buildOngoingShareText(state.currentGame)); };
    document.getElementById('end-game-btn').onclick = endGame;
    document.getElementById('history-back-btn').onclick = ()=> history.back();
    document.getElementById('cancel-round-btn').onclick = ()=> history.back();

    await renderHome();
    const lastId = await sGet('last_active_game_id');
    const saved = lastId ? await sGet('ongoing:'+lastId) : null;
    if(saved && !saved.finished){
      state.currentGame = saved;
      enterAwayState();
      renderBoard();
      showScreen('screen-board');
    } else {
      showScreen('screen-home');
    }
  }
  init();
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
